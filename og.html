<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"IBM Plex Mono",monospace;background:#0A1E3D;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  body::before{content:"";position:absolute;inset:0;background:
      radial-gradient(120% 85% at 50% -12%, rgba(91,154,216,.34), transparent 50%),
      radial-gradient(80% 70% at 86% 6%, rgba(224,190,84,.12), transparent 55%),
      linear-gradient(165deg,#163766,#0A1E3D)}
  .inner{position:relative;z-index:2;padding:0 60px}
  .frame{position:absolute;inset:34px;border:1px solid rgba(224,190,84,.32);border-radius:18px;z-index:1}
  .eyebrow{font-size:18px;letter-spacing:.34em;text-transform:uppercase;color:#E0BE54;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:26px}
  .wm{font-family:"Fraunces",serif;font-weight:900;font-size:128px;line-height:.9;letter-spacing:-.02em;color:#fff}
  .wm em{font-style:italic;font-weight:500;background:linear-gradient(180deg,#E0BE54,#C49A2B);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,#C49A2B,transparent);margin:34px auto}
  .sub{font-size:23px;letter-spacing:.10em;text-transform:uppercase;color:#B8CCE6}
  .sub b{color:#fff}
  .medals{display:flex;gap:16px;justify-content:center;margin-top:34px}
  .m{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .g{background:radial-gradient(circle at 32% 28%,#FBE9A8,#E0BE54 60%,#A07C16)}
  .s{background:radial-gradient(circle at 32% 28%,#FBFCFE,#9BA7B5 58%,#7C8896)}
  .b{background:radial-gradient(circle at 32% 28%,#F0CBA0,#B5783F 60%,#7E5226)}
</style></head>
<body>
  <div class="frame"></div>
  <div class="inner">
    <div class="eyebrow">
      <svg width="20" height="23" viewBox="0 0 13 15" fill="none"><path d="M3 14V1l8 2.4L3 6.2" stroke="#E0BE54" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Conwy Golf Club · Order of Merit
    </div>
    <div class="wm">CONWY <em>Choppers</em></div>
    <div class="rule"></div>
    <div class="sub"><b>Best 6 Stableford</b> &nbsp;·&nbsp; 5 Jun – 30 Sep 2026</div>
    <div class="medals"><span class="m g"></span><span class="m s"></span><span class="m b"></span></div>
  </div>
</body></html>
