<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"IBM Plex Mono",monospace;background:#0A1F16;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  body::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(231,204,114,.14), transparent 55%),
      radial-gradient(90% 70% at 85% 8%, rgba(59,107,78,.40), transparent 60%),
      radial-gradient(120% 100% at 50% 125%, rgba(0,0,0,.65), transparent 55%),
      linear-gradient(180deg,#0C2519,#0A1F16)}
  .inner{position:relative;z-index:2;padding:0 60px}
  .frame{position:absolute;inset:34px;border:1px solid rgba(231,204,114,.28);border-radius:18px;z-index:1}
  .eyebrow{font-size:18px;letter-spacing:.34em;text-transform:uppercase;color:#E7CC72;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:26px}
  .wm{font-family:"Fraunces",serif;font-weight:900;font-size:128px;line-height:.9;letter-spacing:-.02em;color:#F2EBDB}
  .wm em{font-style:italic;font-weight:500;background:linear-gradient(180deg,#E7CC72,#C9A227);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,#C9A227,transparent);margin:34px auto}
  .sub{font-size:23px;letter-spacing:.10em;text-transform:uppercase;color:#D8CEBA}
  .sub b{color:#F2EBDB}
  .medals{display:flex;gap:16px;justify-content:center;margin-top:34px}
  .m{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .g{background:radial-gradient(circle at 32% 28%,#FBE9A8,#E6B93B 60%,#B98E18)}
  .s{background:radial-gradient(circle at 32% 28%,#FBFCFE,#C6CDD4 58%,#9AA2AA)}
  .b{background:radial-gradient(circle at 32% 28%,#F0CBA0,#C5803F 60%,#8C5424)}
</style></head>
<body>
  <div class="frame"></div>
  <div class="inner">
    <div class="eyebrow">
      <svg width="20" height="23" viewBox="0 0 13 15" fill="none"><path d="M3 14V1l8 2.4L3 6.2" stroke="#E7CC72" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Conwy Golf Club · Order of Merit
    </div>
    <div class="wm">CONWY <em>Choppers</em></div>
    <div class="rule"></div>
    <div class="sub"><b>Best 6 Stableford</b> &nbsp;·&nbsp; 5 Jun – 30 Sep 2026</div>
    <div class="medals"><span class="m g"></span><span class="m s"></span><span class="m b"></span></div>
  </div>
</body></html>
